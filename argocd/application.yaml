apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopsphere-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kalyani-Bambal/shopsphere-gitops.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true