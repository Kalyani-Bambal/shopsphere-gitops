name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # ✅ FIXED: Secure Docker login
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}

    # ✅ Build Frontend
    - name: Build Frontend Image
      run: docker build -t ${{ secrets.DOCKER_USER }}/frontend:latest ./frontend

    # ✅ Push Frontend
    - name: Push Frontend Image
      run: docker push ${{ secrets.DOCKER_USER }}/frontend:latest

    # ✅ Build Backend
    - name: Build Backend Image
      run: docker build -t ${{ secrets.DOCKER_USER }}/backend:latest ./backend

    # ✅ Push Backend
    - name: Push Backend Image
      run: docker push ${{ secrets.DOCKER_USER }}/backend:latest