name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Docker Login
      run: docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASS }}

    - name: Build Frontend
      run: docker build -t kalyanibambal97/frontend:latest ./frontend

    - name: Push Frontend
      run: docker push kalyanibambal97/frontend:latest

    - name: Build Backend
      run: docker build -t kalyanibambal97/backend:latest ./backend

    - name: Push Backend
      run: docker push kalyanibambal97/backend:latest