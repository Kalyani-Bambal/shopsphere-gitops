name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2️⃣ 🔑 Login to DockerHub (MUST be before build/push)
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}

    # 3️⃣ Build Frontend
    - name: Build Frontend Image
      run: docker build -t ${{ secrets.DOCKER_USER }}/frontend:latest ./frontend

    # 4️⃣ Push Frontend
    - name: Push Frontend Image
      run: docker push ${{ secrets.DOCKER_USER }}/frontend:latest

    # 5️⃣ Build Backend
    - name: Build Backend Image
      run: docker build -t ${{ secrets.DOCKER_USER }}/backend:latest ./backend

    # 6️⃣ Push Backend
    - name: Push Backend Image
      run: docker push ${{ secrets.DOCKER_USER }}/backend:latest